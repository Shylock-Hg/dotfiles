    #ipam:
      #config:
        #- subnet: 172.25.0.0/16

# =============== 使用前必读 ===============
# 1️⃣ 创建 .env 文件（与 docker-compose.yml 同目录）：
#    GITLAB_URL=https://gitlab.your-company.com/
#    GITLAB_REGISTRATION_TOKEN=glrt-xxxxxx  # 从 GitLab: 项目/组/实例 → Settings → CI/CD → Runners
#    RUNNER_NAME=prod-docker-runner
#    RUNNER_TAGS=docker,linux,prod
#
# 2️⃣ 首次启动（自动注册）：
#    docker-compose up -d
#    # 查看日志确认注册成功：docker-compose logs -f
#
# 3️⃣ 后续重启（配置已持久化在 ./config）：
#    docker-compose restart
#
# 🔒 安全加固建议：
#   • 将 ./config 目录权限设为 600（chmod 600 ./config/config.toml）
#   • 宿主机执行：sudo usermod -aG docker gitlab-runner（若宿主机有 gitlab-runner 用户）
#   • 生产环境：用 HashiCorp Vault 等管理 REGISTRATION_TOKEN
#   • 禁用特权模式：已在环境变量中设置 DOCKER_PRIVILEGED=false
#
# ⚠️ 重要警告：
#   • 挂载 /var/run/docker.sock 有安全风险！确保此 Runner 仅运行可信代码
#   • 切勿在公共仓库提交 .env 文件！将 .env 加入 .gitignore
#   • 如需更高安全：改用 Kubernetes Executor 或 Docker-in-Docker (dind) 模式
#
# 📚 官方参考：
#   • 注册参数详解：https://docs.gitlab.com/runner/register/#docker
#   • 安全最佳实践：https://docs.gitlab.com/runner/security/

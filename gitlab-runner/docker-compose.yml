services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v18.6.0  # 固定版本避免兼容问题
    container_name: shylock-gitlab-runner
    restart: always
    environment:
      # ⚠️ 敏感信息建议通过 .env 文件注入（见下方说明）
      #- REGISTRATION_TOKEN=${GITLAB_REGISTRATION_TOKEN}
      - CI_SERVER_URL=${GITLAB_URL:-https://shylock-server/gitlab/}
      - RUNNER_NAME=${RUNNER_NAME:-docker-runner-prod}
      #- RUNNER_TAG_LIST=${RUNNER_TAGS:-docker,linux,ci}
      - RUNNER_EXECUTOR=docker
      #- DOCKER_IMAGE=alpine:3.18
      # 安全加固：禁止特权模式（关键！）
      - DOCKER_PRIVILEGED=false
      # 可选：设置构建超时（秒）
      - BUILDS_DIR=/builds
      - CACHE_DIR=/cache
    volumes:
      # 持久化 Runner 配置（注册后 config.toml 会存于此）
      - ./config:/etc/gitlab-runner:Z
      # 挂载宿主机 Docker Socket（使 Runner 能创建构建容器）
      - /var/run/docker.sock:/var/run/docker.sock:Z
      # 挂载构建缓存目录（加速后续构建）
      - ./cache:/cache:Z
      # 挂载构建工作目录（避免容器内残留）
      - ./builds:/builds:Z
      # 使用宿主机 DNS（systemd-resolved stub），保留 MagicDNS 搜索域。
      # 因 network_mode: host，容器内的 127.0.0.53 即宿主机的 stub resolver。
      - /run/systemd/resolve/stub-resolv.conf:/etc/resolv.conf:ro
    #networks:
    #  - ci-network
    network_mode: host
    # 安全限制（生产环境强烈建议）
    security_opt:
      - no-new-privileges:true
    # 资源限制（防耗尽宿主机资源）
    mem_limit: 16g
    cpus: 8
    # 健康检查（监控 Runner 状态）
    healthcheck:
      test: ["CMD-SHELL", "gitlab-runner status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

#networks:
  #ci-network:

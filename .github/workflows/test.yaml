name: Test

on:
  pull_request:
    branches: [ "master" ]

env:
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

jobs:

  build:

    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: openSUSE
            image: opensuse
          - name: CachyOS
            image: cachyos
    container:
      image: registry.cn-hangzhou.aliyuncs.com/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}:latest

    steps:
    - name: Check out repository
      env:
        FORGEJO_TOKEN: ${{ github.token }}
      run: |
        git init .
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        auth_header=$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)
        git -c "http.extraHeader=Authorization: Basic ${auth_header}" \
          fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
    - name: test setup
      run: |
        cp -r . ~/dotfiles
        cd ~/dotfiles
        ./setup.sh IN_CI

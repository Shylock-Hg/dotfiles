name: Test

on:
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: openSUSE
            image: shylockhg/opensuse:latest
            bootstrap: ":"
          - name: CachyOS
            image: cachyos/cachyos:latest
            bootstrap: >-
              sed -i '1iServer = https://mirrors.aliyun.com/archlinux/\$repo/os/\$arch'
              /etc/pacman.d/mirrorlist &&
              pacman -Sy --noconfirm --needed nodejs
    container: ${{ matrix.image }}

    steps:
    - name: Bootstrap checkout dependencies
      run: ${{ matrix.bootstrap }}
    - name: Check out repository
      env:
        FORGEJO_TOKEN: ${{ github.token }}
      run: |
        git init .
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        auth_header=$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)
        git -c "http.extraHeader=Authorization: Basic ${auth_header}" \
          fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
    - name: test setup
      run: |
        cp -r . ~/dotfiles
        cd ~/dotfiles
        ./setup.sh IN_CI

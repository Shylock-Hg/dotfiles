name: Test

on:
  pull_request:
    branches: [ "master" ]

env:
  # The ACR namespace is public, not a credential. Repository variables are
  # available to pull-request workflows, including uploaded PRs that do not
  # receive repository secrets. Keep the literal fallback so those runs work
  # even when the repository variable has not been configured yet.
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'shylockhg' }}

jobs:

  build:

    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: openSUSE
            image: opensuse
          - name: CachyOS
            image: cachyos
    container:
      image: registry.cn-hangzhou.aliyuncs.com/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}:latest

    steps:
    - name: Check out repository
      env:
        FORGEJO_TOKEN: ${{ github.token }}
      run: |
        git init .
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        auth_header=$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)
        git -c "http.extraHeader=Authorization: Basic ${auth_header}" \
          fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
    - name: test setup
      run: |
        cp -r . ~/dotfiles
        cd ~/dotfiles
        ./setup.sh IN_CI

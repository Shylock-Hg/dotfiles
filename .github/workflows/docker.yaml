name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "docker/Dockerfile"
      - "zypper/**"
      - "rust/**"
      - "ocaml/**"

jobs:
  build:
    # The configured self-hosted runner has Docker socket access. Keep this job
    # off pull_request events: Docker access is root-equivalent and registry
    # credentials must only be exposed to trusted revisions.
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . \
          --file docker/Dockerfile \
          --tag "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_USERNAME }}/opensuse:latest"
    - name: Log in to Aliyun Container Registry
      run: |
        printf '%s' "${{ secrets.ACR_PASSWORD }}" | docker login \
          --username "${{ secrets.ACR_USERNAME }}" \
          --password-stdin registry.cn-hangzhou.aliyuncs.com
    - name: Push the Docker image
      run: docker push "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_USERNAME }}/opensuse:latest"

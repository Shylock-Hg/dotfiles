name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '30 0 * * *'

jobs:
  build:
    # The configured self-hosted runner has Docker socket access. Keep this job
    # off pull_request events: Docker access is root-equivalent and registry
    # credentials must only be exposed to trusted revisions.
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . \
          --file docker/Dockerfile \
          --tag "${{ secrets.DOCKER_USERNAME }}/opensuse:latest"
    - name: Log in to Docker registry
      run: |
        echo "${{ secrets.DOCKER_ACK }}" | docker login \
          --username "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin
    - name: Push the Docker image
      run: docker push "${{ secrets.DOCKER_USERNAME }}/opensuse:latest"

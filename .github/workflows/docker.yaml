name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/docker.yaml"
      - "docker/Dockerfile"
      - "docker/cachyos.Dockerfile"
      - "zypper/**"
      - "pacman/**"
      - "rust/**"
      - "ocaml/**"

jobs:
  build:
    # The configured self-hosted runner has Docker socket access. Keep this job
    # off pull_request events: Docker access is root-equivalent and registry
    # credentials must only be exposed to trusted revisions.
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            image: opensuse
          - dockerfile: docker/cachyos.Dockerfile
            image: cachyos

    steps:
    - name: Check out repository
      env:
        FORGEJO_TOKEN: ${{ github.token }}
      run: |
        git init .
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        auth_header=$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)
        git -c "http.extraHeader=Authorization: Basic ${auth_header}" \
          fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
    - name: Build the Docker image
      run: |
        docker build . \
          --file "${{ matrix.dockerfile }}" \
          --tag "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:latest"
    - name: Log in to Aliyun Container Registry
      run: |
        printf '%s' "${{ secrets.ACR_PASSWORD }}" | docker login \
          --username "${{ secrets.ACR_USERNAME }}" \
          --password-stdin registry.cn-hangzhou.aliyuncs.com
    - name: Push the Docker image
      timeout-minutes: 30
      run: docker push "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:latest"

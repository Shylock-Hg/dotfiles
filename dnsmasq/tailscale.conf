# only listen Tailscale interface
interface=tailscale0
# Use bind-dynamic, not bind-interfaces: tailscaled assigns the Tailscale IPv4
# (100.64.0.2) only after it connects to the control server, which can happen
# after dnsmasq starts. bind-interfaces would then never bind that address,
# leaving ~shylockhg.me unresolvable until dnsmasq is restarted by hand;
# bind-dynamic picks the address up when it appears.
bind-dynamic
except-interface=lo

no-resolv

# custom domain
address=/forgejo.shylockhg.me/100.64.0.2
address=/forge-bot.shylockhg.me/100.64.0.2

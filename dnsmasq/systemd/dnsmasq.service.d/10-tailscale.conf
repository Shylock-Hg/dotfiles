# dnsmasq can be started before tailscaled has created tailscale0. With
# `interface=tailscale0` that used to be fatal ("unknown interface tailscale0")
# and left ~shylockhg.me unresolvable until dnsmasq was restarted by hand.
#
# `bind-dynamic` in tailscale.conf already makes a late interface non-fatal,
# but order after tailscaled and keep retrying as well so a boot race can
# never leave the split DNS down.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
Restart=on-failure
RestartSec=3

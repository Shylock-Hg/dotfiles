# Split DNS for the local machine:
#   public names        -> the normal (domestic) resolver from the router
#   shylockhg.me        -> dnsmasq on the Tailscale IP (static address= entries)
#   headscale.internal  -> dnsmasq -> Tailscale MagicDNS (100.100.100.100)
#
# The `headscale.internal` search domain is what makes short tailnet names
# (e.g. `ping work-wsl`) work; dnsmasq forwards the suffix to MagicDNS.
#
# There is deliberately no `~.` here, and earlier versions had none either.
# The catch-all that used to break public lookups was installed at runtime by
# Tailscale, not by this file.
#
# setup.sh calls `tailscale set --accept-dns=false`. Tailscale would otherwise
# install its own `~.` default route on tailscale0 pointing at MagicDNS, whose
# upstreams are 1.1.1.1/1.0.0.1 (pushed by Headscale). Those geolocate this
# device outside mainland China, so GeoDNS answers with Baidu's overseas
# cluster (www.baidu.com -> www.wshifen.com -> 103.235.46.x), i.e. 300-5500 ms
# instead of the ~130 ms the domestic answer (183.2.172.177) costs. Without
# that Tailscale route, `~.` falls back to the DHCP resolver from the router.
#
# MagicDNS keeps running on 100.100.100.100 with accept-dns=false, so tailnet
# name resolution does not depend on the disabled catch-all.
[Resolve]
DNS=100.64.0.2
Domains=~shylockhg.me ~headscale.internal headscale.internal

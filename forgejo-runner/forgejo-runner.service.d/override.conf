# Managed by dotfiles/forgejo-runner/setup.sh -- installed to
# /etc/systemd/system/forgejo-runner.service.d/override.conf
#
# Inject the Forgejo runner registration token as a systemd credential.
# systemd reads /etc/forgejo-runner/token as root and exposes a private copy to
# the service in $CREDENTIALS_DIRECTORY; config.yaml then references it with
#     token_url: file:$CREDENTIALS_DIRECTORY/forgejo-token
# so the token never appears in config.yaml, in the process arguments, or in
# the service environment.

[Service]
LoadCredential=forgejo-token:/etc/forgejo-runner/token

# The runner uses Docker to execute `docker://` labels, but the
# forgejo-runner user is not in the docker group. Grant access to the Docker
# socket explicitly instead of running `usermod -aG docker forgejo-runner`.
# NOTE: this makes the runner root-equivalent on the host; only run trusted
# workflows, or drop the `docker://` labels and rely on `host` labels.
SupplementaryGroups=docker

# At-rest encryption variant: encrypt the token with
#   systemd-creds encrypt --name=forgejo-token \
#       /etc/forgejo-runner/token /etc/forgejo-runner/token.cred
# then use the line below instead of LoadCredential and delete the plaintext:
# LoadCredentialEncrypted=forgejo-token:/etc/forgejo-runner/token.cred
